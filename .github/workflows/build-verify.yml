name: Verify dist is in sync

# The action runs the committed dist/index.js bundle (see action.yaml), so a PR
# whose source changed without rebuilding — or whose bundle was tampered with —
# would ship code that does not match source (Mythos #193853, CWE-494).
# This gate rebuilds from source and fails if the committed bundle differs.
on:
  pull_request:
  push:
    branches: [master]

# Least privilege: this gate only needs to check out and diff — no write scope.
permissions:
  contents: read

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a commit SHA (not a mutable tag) so a repointed
      # tag / upstream compromise cannot inject code into this integrity gate.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Fail if dist/ differs from a fresh build of source
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of sync with source. Run 'npm run build' and commit the result."
            exit 1
          fi
