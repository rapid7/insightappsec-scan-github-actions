name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test

  verify-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ differs from a fresh build of source
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --porcelain -- dist/
            echo "::error::dist/ is out of sync with source. Run 'npm run build' and commit the result."
            exit 1
          fi
          echo "dist/ is in sync with source."